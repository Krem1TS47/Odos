[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobassist"
version = "0.1.0"
description = "Local Job Application Assistant (Gemini + Playwright)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "playwright",
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    "typer>=0.9.0",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
jobassist = "jobassist.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
